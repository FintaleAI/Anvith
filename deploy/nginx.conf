# /etc/nginx/sites-available/anvithbizcap
#
# Nginx reverse-proxy for the Next.js app. Replaces the old static-file vhost.
# Install:
#   1. Copy to /etc/nginx/sites-available/anvithbizcap
#   2. nginx -t && systemctl reload nginx
#
# Production app listens on 127.0.0.1:3010 (PM2-supervised, see deploy/post-receive).
# Port chosen to avoid clashes with existing services on the VPS:
#   3001 — taskflow-app (Docker)
#   9001 — fintale.io webhook (PM2)

upstream anvithbizcap_app {
    server 127.0.0.1:3010;
    keepalive 32;
}

# ---------- HTTP (port 80) — ACME challenges + redirect ----------
server {
    listen 80;
    listen [::]:80;
    server_name anvithbizcap.com www.anvithbizcap.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS (port 443) ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name anvithbizcap.com www.anvithbizcap.com;

    # Certbot-managed cert
    ssl_certificate     /etc/letsencrypt/live/anvithbizcap.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anvithbizcap.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ----- Security headers (snippet shared with other services) -----
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    # Note: Next.js inlines critical JS — must allow 'unsafe-inline' for scripts in dev/prod.
    # We use a moderately strict CSP that allows self + Google Fonts + inline (required by Next).
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # ----- Compression -----
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml+rss text/xml font/ttf font/otf application/wasm;

    # ----- Body / buffer limits (lead-form uploads stay small) -----
    client_max_body_size 5m;
    proxy_read_timeout 60s;
    proxy_connect_timeout 10s;

    # ----- Long-cache Next.js immutable bundles -----
    location /_next/static/ {
        proxy_pass http://anvithbizcap_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ----- Long-cache public/ files -----
    location ~* \.(svg|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|avif)$ {
        proxy_pass http://anvithbizcap_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=2592000" always;
    }

    # ----- Catch-all reverse proxy to Next.js -----
    location / {
        proxy_pass http://anvithbizcap_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;
    }

    access_log /var/log/nginx/anvithbizcap.access.log;
    error_log  /var/log/nginx/anvithbizcap.error.log warn;
}
